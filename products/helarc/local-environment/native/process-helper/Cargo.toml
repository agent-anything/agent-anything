[package]
name = "helarc-process-helper"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes"] }

[profile.release]
panic = "abort"
strip = true

[[bin]]
name = "helarc-process-helper"
path = "src/main.rs"

[[bin]]
name = "process-fixture"
path = "tests/process_fixture.rs"
