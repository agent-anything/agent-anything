[package]
name = "helarc-credential-helper"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[profile.release]
panic = "abort"
strip = true
